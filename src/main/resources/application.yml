spring:
  application:
    name: education-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/education_management_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  default-users:
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    teacher-password: ${TEACHER_PASSWORD:Teacher@12345}
    student-password: ${STUDENT_PASSWORD:Student@12345}